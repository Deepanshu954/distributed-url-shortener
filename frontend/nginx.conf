server {
    listen 3000;
    server_name localhost;

    # Static assets
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # API Proxy to backend gateway
    location /api/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend SPA Pages
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ^~ /dashboard {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ^~ /links {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Any other path (e.g. /M1A2f) is a short code -> proxy directly to backend for instant HTTP 302 redirect!
    location / {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
