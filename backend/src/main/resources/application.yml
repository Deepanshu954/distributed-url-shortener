spring:
  application:
    name: url-shortener
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: false # migrations run programmatically per shard and for analytics DB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.query.timeout: 1000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        max.block.ms: 250
  data:
    redis:
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

server:
  port: 8080
  tomcat:
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
    kafka:
      enabled: ${KAFKA_HEALTH_ENABLED:false}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,200ms,500ms,1s

app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  node-id: ${NODE_ID:1}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  snowflake:
    epoch: 2024-01-01T00:00:00Z
  analytics-db:
    jdbc-url: ${ANALYTICS_DB_URL:jdbc:h2:mem:analytics;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${ANALYTICS_DB_USER:sa}
    password: ${ANALYTICS_DB_PASSWORD:}
    pool-size: ${ANALYTICS_DB_POOL_SIZE:5}
  sharding:
    enabled: ${SHARDING_ENABLED:false}
    vnodes: 150
    shards:
      - name: shard1
        primary:
          jdbc-url: ${SHARD1_PRIMARY_URL:jdbc:postgresql://shard1-primary:5432/shortener}
          username: ${SHARD_DB_USER:shortener}
          password: ${SHARD_DB_PASSWORD:shortener}
          pool-size: ${SHARD_POOL_SIZE:10}
        replica:
          jdbc-url: ${SHARD1_REPLICA_URL:jdbc:postgresql://shard1-replica:5432/shortener}
          username: ${SHARD_DB_USER:shortener}
          password: ${SHARD_DB_PASSWORD:shortener}
          pool-size: ${SHARD_POOL_SIZE:10}
      - name: shard2
        primary:
          jdbc-url: ${SHARD2_PRIMARY_URL:jdbc:postgresql://shard2-primary:5432/shortener}
          username: ${SHARD_DB_USER:shortener}
          password: ${SHARD_DB_PASSWORD:shortener}
          pool-size: ${SHARD_POOL_SIZE:10}
        replica:
          jdbc-url: ${SHARD2_REPLICA_URL:jdbc:postgresql://shard2-replica:5432/shortener}
          username: ${SHARD_DB_USER:shortener}
          password: ${SHARD_DB_PASSWORD:shortener}
          pool-size: ${SHARD_POOL_SIZE:10}

ratelimit:
  enabled: ${RATELIMIT_ENABLED:false}
  limiters:
    write:    { capacity: 10,  refill-per-minute: 10,  fail-open: false }
    redirect: { capacity: 100, refill-per-minute: 100, fail-open: true }

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 20
      failureRateThreshold: 50
      waitDurationInOpenState: 5s
      permittedNumberOfCallsInHalfOpenState: 3
  instances:
    redis-cache:
      baseConfig: default
    redis-ratelimit:
      baseConfig: default
    kafka-publisher:
      baseConfig: default
      waitDurationInOpenState: 10s
    shard-shard1:
      baseConfig: default
    shard-shard2:
      baseConfig: default
